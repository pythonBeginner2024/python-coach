<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Python Coach : apprendre Python en pratiquant</title>
<style>
:root{
  --bg:#F1F4F9; --surface:#FFFFFF; --surface-2:#F6F8FC; --line:#D5DDEA;
  --ink:#0F2342; --ink-2:#51607C;
  --blue:#2B5F9E; --blue-ink:#FFFFFF;
  --yellow:#FFD43B; --yellow-ink:#3D2F00;
  --green:#17794E; --green-bg:#E3F4EB;
  --red:#B3302F; --red-bg:#FCE8E7;
  --warn-bg:#FFF6D1; --warn-line:#E2BD1E;
  --term:#0F2342; --term-ink:#E6EDF9; --term-dim:#8FA3C4; --term-err:#FFB4B0;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0A1424; --surface:#10223B; --surface-2:#0D1B30; --line:#243A5C;
    --ink:#E6EDF9; --ink-2:#9FB1CE;
    --blue:#7DB1F0; --blue-ink:#07182E;
    --green:#5FD39A; --green-bg:#0F2E24;
    --red:#FF8F8B; --red-bg:#35171A;
    --warn-bg:#3A3110; --warn-line:#8C741A;
    --term:#060E1B; --term-dim:#7F94B8;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans)}
h1,h2,h3{font-family:var(--serif);line-height:1.15;letter-spacing:-.01em;margin:0}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-2)}
.small{font-size:14px;margin:0}

/* En-tête */
.topbar{border-bottom:1px solid var(--line);background:var(--surface)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:62px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:700;font-size:21px;color:var(--ink);text-decoration:none}
.brand-mark{width:28px;height:28px;position:relative;flex:none}
.brand-mark::before,.brand-mark::after{content:"";position:absolute;width:17px;height:17px;border-radius:5px}
.brand-mark::before{background:var(--blue);top:0;left:0}
.brand-mark::after{background:var(--yellow);bottom:0;right:0}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;border:1px solid var(--line);border-radius:999px;font-size:14px;background:var(--surface-2);color:var(--ink-2)}
.pill .dot{width:9px;height:9px;border-radius:50%;background:var(--ink-2);flex:none}
.pill[data-state=ready] .dot{background:var(--green)}
.pill[data-state=loading] .dot{background:var(--yellow);animation:pulse 1.2s ease-in-out infinite}
.pill[data-state=error] .dot{background:var(--red)}
.pill:not(:has(button:not([hidden]))){padding-right:12px}
.linkbtn{font:inherit;font-size:13px;font-weight:600;color:var(--blue);background:transparent;border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer}
@keyframes pulse{50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

main.wrap{padding-top:34px;padding-bottom:64px;outline:0}
.foot{padding-top:18px;padding-bottom:40px;border-top:1px solid var(--line);color:var(--ink-2);font-size:14px}
.foot p{margin:4px 0}

/* Boutons */
.btn{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;cursor:pointer;min-height:42px;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn:hover:not(:disabled){border-color:var(--blue)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.btn.accent{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:var(--red);background:transparent}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}
.actions .hint{font-size:13px;color:var(--ink-2)}

/* Alertes */
.alert{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid;border-radius:10px;padding:12px 14px;margin:0 0 14px}
.alert.warn{background:var(--warn-bg);border-color:var(--warn-line)}
.alert.bad{background:var(--red-bg);border-color:var(--red)}
.alert.good{background:var(--green-bg);border-color:var(--green)}
.spin{width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;flex:none}

/* Tableau de bord */
.hero{max-width:720px;padding:6px 0 30px}
.hero h1{font-size:clamp(32px,5.5vw,50px)}
.hero p{color:var(--ink-2);font-size:18px;max-width:58ch;margin:14px 0 22px}
.section-title{font-size:24px;margin:8px 0 14px}
.mods{display:grid;gap:14px}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:12px}
.mod.main{border:2px solid var(--blue)}
.mod h3{font-size:24px}
.mod p{margin:0}
.mod-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.badge{font-size:13px;font-weight:600;border-radius:999px;padding:2px 10px;border:1px solid var(--line);color:var(--ink-2)}
.main .badge,.badge.ok{border-color:var(--green);color:var(--green)}
.mod.soon{background:transparent;border-style:dashed;padding:14px 18px;grid-template-columns:1fr auto;align-items:center;color:var(--ink-2)}
.mod.soon h3{font-family:var(--sans);font-size:16px;font-weight:600;color:var(--ink-2)}
.bar{height:10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue);transition:width .3s}
.reset-zone{margin-top:30px}

/* Module : étapes */
.crumb{display:inline-block;margin-bottom:16px;font-size:14px}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:36px;align-items:start}
.layout>*{min-width:0}
.stepper{list-style:none;margin:0;padding:0;position:sticky;top:16px;display:grid;gap:4px}
.stepper .group{font-size:13px;color:var(--ink-2);padding:10px 12px 2px;font-weight:600}
.stepper a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:15px;border:1px solid transparent;position:relative}
.stepper a:hover{background:var(--surface)}
.stepper a[aria-current=step]{background:var(--surface);border-color:var(--line);font-weight:600}
.mark{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;line-height:1}
.stepper a.done .mark{background:var(--green);border-color:var(--green);color:var(--surface)}
.stepper a[aria-current=step] .mark{border-color:var(--yellow);background:var(--yellow);color:var(--yellow-ink)}
@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr);gap:18px}
  .stepper{position:static;display:flex;overflow-x:auto;gap:6px;padding-bottom:8px}
  .stepper .group{display:none}
  .stepper a{white-space:nowrap;border-color:var(--line);background:var(--surface)}
}

.step h2{font-size:clamp(27px,4.2vw,36px);margin:2px 0 16px}
.prose{max-width:68ch}
.prose p,.prose ul,.prose ol{margin:0 0 14px}
.prose li{margin-bottom:4px}
.prose code,.brief code{font-family:var(--mono);font-size:.92em;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.prose .scroll{overflow-x:auto;margin:0 0 14px}
.prose table{border-collapse:collapse;width:100%;font-size:15px}
.prose th,.prose td{border:1px solid var(--line);padding:8px 10px;text-align:left}
.prose th{background:var(--surface-2)}
.brief{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--yellow);border-radius:10px;padding:16px 18px;margin-bottom:16px;max-width:68ch}
.brief p{margin:0 0 6px}
.brief ol{margin:6px 0 0;padding-left:22px}
.try{font-weight:600}

/* Éditeur */
.editor{display:grid;grid-template-columns:auto minmax(0,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.editor:focus-within{outline:3px solid var(--blue);outline-offset:1px}
.gutter,.code{font:14px/1.6 var(--mono)}
.gutter{margin:0;padding:12px 10px 12px 12px;text-align:right;color:var(--ink-2);background:var(--surface-2);border-right:1px solid var(--line);overflow:hidden;user-select:none}
.code{display:block;width:100%;border:0;resize:none;background:transparent;color:var(--ink);padding:12px 14px;tab-size:4;white-space:pre;overflow-x:auto;overflow-y:hidden;margin:0}
.code:focus-visible{outline:none}

/* Résultat et variables */
.io{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;margin:12px 0 16px}
@media (max-width:860px){.io{grid-template-columns:minmax(0,1fr)}}
.panel{border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.panel>h3{font:600 14px var(--sans);letter-spacing:0;padding:8px 12px;margin:0;background:var(--surface-2);border-bottom:1px solid var(--line)}
.panel .body{padding:12px 14px;min-height:96px}
.console{background:var(--term);color:var(--term-ink);border-color:var(--term)}
.console>h3{background:transparent;color:var(--term-dim);border-bottom:1px solid rgba(255,255,255,.14)}
.console .body{font:14px/1.6 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.console .muted{color:var(--term-dim)}
.console .err{color:var(--term-err);margin-top:8px}
.console .err b{font-weight:700}
.console .why{font-family:var(--sans);white-space:normal;color:var(--term-dim);margin-top:6px}
.vars .body{display:grid;gap:8px;align-content:start}
.var{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:baseline;font:14px/1.4 var(--mono)}
.var .nm{font-weight:700}
.var .vl{overflow-wrap:anywhere;color:var(--ink-2)}
.tag{font:600 12px var(--mono);padding:2px 9px;border-radius:999px;border:1px solid var(--blue);color:var(--blue)}

/* Vérification et explications */
.checks{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:6px;max-width:68ch}
.checks li{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
.checks .ok{background:var(--green-bg);border-color:var(--green)}
.checks .ko{background:var(--red-bg);border-color:var(--red)}
.checks .ic{font-weight:700;flex:none;width:1.2em;text-align:center}
.checks .ok .ic{color:var(--green)}
.checks .ko .ic{color:var(--red)}
.hintbox{max-width:68ch;margin:0 0 16px;padding:12px 14px;border-radius:10px;border:1px dashed var(--blue)}
.explain{background:var(--surface);border:1px solid var(--green);border-left-width:6px;border-radius:10px;padding:18px 20px;margin:0 0 16px}
.explain.open{border-color:var(--line);border-left-color:var(--blue)}
.explain h3{font-size:22px;margin-bottom:10px}
.sol{font:14px/1.6 var(--mono);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;margin:6px 0 0;white-space:pre}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.nav .spacer{flex:1}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true"></span>Python Coach</a>
    <div class="pill" id="py-pill" data-state="idle" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <span id="py-label">Python : pas encore chargé</span>
      <button type="button" class="linkbtn" id="py-retry" hidden>Réessayer</button>
    </div>
  </div>
</header>

<main class="wrap" id="app" tabindex="-1">
  <noscript><p>Python Coach a besoin de JavaScript pour fonctionner. Active JavaScript dans ton navigateur puis recharge la page.</p></noscript>
</main>

<footer class="wrap foot">
  <p>Python Coach, version 1. Ton code est exécuté par un vrai interpréteur Python (Pyodide) dans ton navigateur : rien n'est envoyé à un serveur.</p>
  <p id="storage-note">Ta progression est enregistrée sur cet appareil, dans ce navigateur.</p>
</footer>

<script>
(function () {
'use strict';

/* =====================================================================
   1. DONNÉES PÉDAGOGIQUES (module 1)
   ===================================================================== */
// <DATA>
const MODULES = [
  {
    id: 'm1',
    title: 'Variables et types de base',
    summary: 'Stocker une valeur dans une variable, reconnaître les types int, float, str et bool, et afficher des résultats avec print().',
    available: true,
    doneText: 'Tu sais créer des variables, reconnaître les types de base et afficher des résultats avec print().',
    steps: [
      {
        id: 'l1', kind: 'lesson', title: 'Les variables',
        html: `
<p>Une <strong>variable</strong> est un nom qui désigne une valeur gardée en mémoire. Imagine une étiquette collée sur une boîte : l'étiquette est le nom, la boîte contient la valeur.</p>
<p>On crée une variable avec le signe <code>=</code> :</p>
<ul>
  <li>Le nom se met à gauche, la valeur à droite : <code>age = 25</code>.</li>
  <li>Un nom contient des lettres, des chiffres et le caractère <code>_</code>. Il ne contient pas d'espace et ne commence pas par un chiffre.</li>
  <li>Les majuscules comptent : <code>Age</code> et <code>age</code> sont deux variables différentes.</li>
  <li>Une variable peut changer de valeur. <code>compteur = compteur + 1</code> lit l'ancienne valeur, ajoute 1, puis range le résultat dans la même variable.</li>
</ul>
<p class="try">À toi : exécute l'exemple, puis change les valeurs et exécute-le à nouveau.</p>`,
        example: `compteur = 1
print(compteur)

compteur = compteur + 1
print(compteur)
`
      },
      {
        id: 'l2', kind: 'lesson', title: 'Les types de base',
        html: `
<p>Chaque valeur a un <strong>type</strong>, qui indique ce qu'elle représente et ce qu'on peut en faire. Il y en a quatre à connaître pour commencer :</p>
<div class="scroll"><table>
  <thead><tr><th>Type</th><th>Ce qu'il représente</th><th>Exemples</th></tr></thead>
  <tbody>
    <tr><td><code>int</code></td><td>un nombre entier</td><td><code>42</code>, <code>-3</code></td></tr>
    <tr><td><code>float</code></td><td>un nombre décimal (avec un point)</td><td><code>3.14</code>, <code>12.5</code></td></tr>
    <tr><td><code>str</code></td><td>un texte, entre guillemets</td><td><code>"Bonjour"</code>, <code>'42'</code></td></tr>
    <tr><td><code>bool</code></td><td>vrai ou faux</td><td><code>True</code>, <code>False</code></td></tr>
  </tbody>
</table></div>
<p>La fonction <code>type()</code> te donne le type d'une valeur. Attention : <code>42</code> est un nombre, mais <code>"42"</code> est un texte, car il est entre guillemets.</p>
<p class="try">À toi : exécute l'exemple, puis ajoute une ligne pour afficher le type de <code>"Bonjour"</code>.</p>`,
        example: `print(type(42))
print(type(3.14))
print(type("42"))
print(type(True))
`
      },
      {
        id: 'l3', kind: 'lesson', title: 'Afficher avec print()',
        html: `
<p><code>print()</code> affiche une valeur à l'écran. C'est ton outil principal pour voir ce que fait ton programme.</p>
<ul>
  <li>Tu peux afficher plusieurs valeurs en les séparant par des virgules. Python les sépare par un espace : <code>print("Tu as", age, "ans")</code>.</li>
  <li>Le signe <code>+</code> colle des textes entre eux, mais il ne mélange pas un texte et un nombre.</li>
  <li>Une ligne qui commence par <code>#</code> est un commentaire : Python l'ignore. Elle sert à t'expliquer le code.</li>
</ul>
<p class="try">À toi : remplace les virgules par des <code>+</code> dans le deuxième <code>print()</code> et lis le message d'erreur. Comprendre les erreurs fait partie de l'apprentissage.</p>`,
        example: `prenom = "Awa"
age = 25

# Les virgules acceptent tous les types
print("Bonjour", prenom)
print("Tu as", age, "ans")
`
      },
      {
        id: 'ex1', kind: 'exercise', title: 'Ta première variable',
        brief: `
<p>Crée une variable et affiche un message de bienvenue.</p>
<ol>
  <li>Crée une variable <code>prenom</code> qui contient ton prénom (entre guillemets).</li>
  <li>Avec <code>print()</code>, affiche le mot <code>Bonjour</code> suivi de ton prénom.</li>
</ol>`,
        hint: `Un texte s'écrit entre guillemets : <code>prenom = "Awa"</code>. Dans <code>print()</code>, sépare les valeurs par une virgule.`,
        starter: `# Exercice 1 : ta première variable
# 1. Crée la variable prenom
# 2. Affiche "Bonjour" suivi de ton prénom

`,
        checks: [
          { label: 'La variable prenom existe et contient un texte',
            test: (r) => !!r.variables.prenom && r.variables.prenom.type === 'str' },
          { label: 'prenom n\'est pas vide',
            test: (r) => !!r.variables.prenom && r.variables.prenom.type === 'str' && String(r.variables.prenom.value || '').trim().length > 0 },
          { label: 'Le programme affiche « Bonjour » suivi de ton prénom',
            test: (r) => {
              const p = r.variables.prenom;
              if (!p || p.type !== 'str' || !p.value || !p.value.trim()) return false;
              const out = r.stdout.toLowerCase();
              return out.includes('bonjour') && out.includes(p.value.trim().toLowerCase());
            } }
        ],
        solution: `prenom = "Awa"
print("Bonjour", prenom)`,
        explanation: `
<p><code>prenom = "Awa"</code> crée une variable de type <code>str</code> (un texte). Les guillemets sont indispensables : sans eux, Python chercherait une variable nommée <code>Awa</code> et afficherait une <code>NameError</code>.</p>
<p><code>print("Bonjour", prenom)</code> affiche deux valeurs séparées par un espace. Le mot <code>"Bonjour"</code> est écrit entre guillemets, car c'est un texte. <code>prenom</code> est écrit sans guillemets, car c'est le nom de la variable : Python va chercher sa valeur.</p>
<p>À retenir : <strong>avec des guillemets, c'est un texte ; sans guillemets, c'est un nom de variable</strong>.</p>`
      },
      {
        id: 'ex2', kind: 'exercise', title: 'Reconnaître les types',
        brief: `
<p>Crée trois variables de types différents, puis demande à Python le type de chacune.</p>
<ol>
  <li><code>age</code> : un nombre entier.</li>
  <li><code>taille</code> : un nombre décimal (une taille en mètres, par exemple).</li>
  <li><code>est_etudiant</code> : un booléen (<code>True</code> ou <code>False</code>).</li>
  <li>Affiche le type de chaque variable avec <code>print(type(...))</code>.</li>
</ol>`,
        hint: `Un décimal s'écrit avec un point : <code>1.75</code>. Un booléen s'écrit <code>True</code> ou <code>False</code>, avec une majuscule et sans guillemets. Pour afficher un type : <code>print(type(age))</code>.`,
        starter: `# Exercice 2 : reconnaître les types
# 1. Crée age (entier), taille (décimal) et est_etudiant (booléen)
# 2. Affiche le type de chacune avec print(type(...))

`,
        checks: [
          { label: 'age est un nombre entier (int)',
            test: (r) => !!r.variables.age && r.variables.age.type === 'int' },
          { label: 'taille est un nombre décimal (float)',
            test: (r) => !!r.variables.taille && r.variables.taille.type === 'float' },
          { label: 'est_etudiant est un booléen (bool)',
            test: (r) => !!r.variables.est_etudiant && r.variables.est_etudiant.type === 'bool' },
          { label: 'Le programme affiche les trois types',
            test: (r) => r.stdout.includes("<class 'int'>") && r.stdout.includes("<class 'float'>") && r.stdout.includes("<class 'bool'>") },
          { label: 'Tu utilises la fonction type()',
            test: (r, code) => /\btype\s*\(/.test(code) }
        ],
        solution: `age = 25
taille = 1.75
est_etudiant = True

print(type(age))
print(type(taille))
print(type(est_etudiant))`,
        explanation: `
<p>Python déduit le type de chaque variable à partir de la valeur écrite : <code>25</code> est un <code>int</code>, <code>1.75</code> est un <code>float</code>, et <code>True</code> est un <code>bool</code>.</p>
<p><code>type()</code> renvoie le type d'une valeur. Python l'affiche sous la forme <code>&lt;class 'int'&gt;</code> : « class » signifie simplement que <code>int</code> est le nom du type.</p>
<p>Deux pièges fréquents : <code>"25"</code> (entre guillemets) est un texte, pas un entier. Et en Python, un décimal s'écrit avec un <strong>point</strong> (<code>1.75</code>), pas avec une virgule.</p>`
      },
      {

import sys, io, json, math, types, time, traceback

class _PCTimeout(BaseException):
    pass

class _PCBuf(io.StringIO):
    over = False
    def write(self, s):
        if self.tell() >= 20000:
            self.over = True
            return len(s)
        return super().write(s)

def _pc_val(v):
    if isinstance(v, bool):
        return v
    if isinstance(v, int):
        return v if abs(v) < 2**53 else None
    if isinstance(v, float):
        return v if math.isfinite(v) else None
    if isinstance(v, str):
        return v[:200]
    return None

def _pc_tracer(deadline):
    ticks = [0]
    def tracer(frame, event, arg):
        if frame.f_code.co_filename != "<exercice>":
            return None
        def local(frame, event, arg):
            ticks[0] += 1
            if ticks[0] % 256 == 0 and time.monotonic() > deadline:
                raise _PCTimeout()
            return local
        return local
    return tracer

def _pc_error(e, limit):
    if isinstance(e, SystemExit):
        return {"type": "SystemExit", "message": "Le programme a été arrêté par exit().", "line": None}
    if isinstance(e, SyntaxError):
        return {"type": type(e).__name__, "message": str(e.msg), "line": e.lineno}
    line = None
    for fr in traceback.extract_tb(e.__traceback__):
        if fr.filename == "<exercice>":
            line = fr.lineno
    if isinstance(e, _PCTimeout):
        return {"type": "Timeout", "message": "Le programme a été arrêté : il tourne depuis plus de " + str(int(limit)) + " secondes (boucle infinie ?).", "line": line}
    return {"type": type(e).__name__, "message": str(e), "line": line}

def __pc_run(code, limit=10):
    buf = _PCBuf()
    ns = {"__name__": "__main__"}
    error = None
    tracer = _pc_tracer(time.monotonic() + float(limit))
    old_out, old_err = sys.stdout, sys.stderr
    sys.stdout = buf
    sys.stderr = buf
    try:
        sys.settrace(tracer)
        exec(compile(code, "<exercice>", "exec"), ns)
    except BaseException as e:
        error = _pc_error(e, limit)
    finally:
        sys.settrace(None)
        sys.stdout = old_out
        sys.stderr = old_err
    variables = {}
    for name, value in ns.items():
        if name.startswith("_") or isinstance(value, types.ModuleType) or callable(value):
            continue

            shown = repr(value)
        except Exception:
            shown = "<non affichable>"

    return json.dumps({
        "stdout": out[:20000],
        "truncated": buf.over or len(out) > 20000,
        "error": error,
        "variables": variables
    }, ensure_ascii=False)

def __pc_eval(code, exprs_json, limit=5):
    exprs = json.loads(exprs_json)
    buf = _PCBuf()
    ns = {"__name__": "__main__"}
    error = None
    results = []
    tracer = _pc_tracer(time.monotonic() + float(limit))
    old_out, old_err = sys.stdout, sys.stderr
    sys.stdout = buf
    sys.stderr = buf
    try:
        sys.settrace(tracer)
        exec(compile(code, "<exercice>", "exec"), ns)
        for ex in exprs:
            try:
                if ex.startswith("!"):
                    exec(compile(ex[1:], "<test>", "exec"), ns)
                    results.append({"ok": True, "repr": None})
                    continue
                v = eval(compile(ex, "<test>", "eval"), ns)
                results.append({"ok": True, "repr": repr(v)[:200]})
            except _PCTimeout:
                raise
            except BaseException as e:
                results.append({"ok": False, "error": type(e).__name__, "message": str(e)[:200]})

        error = _pc_error(e, limit)
    finally:

        sys.stdout = old_out
        sys.stderr = old_err

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, '');
      else el.setAttribute(k, v);
    }
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.async = true;
    s.onload = () => resolve();
    s.onerror = () => { s.remove(); reject(new Error('SCRIPT')); };
    document.head.appendChild(s);
  });
}
function explainLoadError(e) {

  if (m === 'TIMEOUT') return 'Le chargement a dépassé ' + (LOAD_TIMEOUT_MS / 1000) + ' secondes. Ta connexion est peut-être trop lente.';
  if (m === 'SCRIPT') return 'Impossible de télécharger Pyodide depuis cdn.jsdelivr.net. Vérifie ta connexion Internet, ou désactive un bloqueur de contenu qui filtrerait ce site.';
  if (m === 'NO_LOADER') return 'Le script Pyodide a été téléchargé, mais il ne s\'est pas initialisé correctement.';
  return 'Erreur pendant l\'initialisation de Python (détail technique : ' + m + ').';

async function loadPython() {
  if (py.state === 'loading' || py.state === 'ready') return;
  Object.assign(py, { state: 'loading', error: '', startedAt: Date.now(), elapsed: 0 });
  clearInterval(py.timer);
  py.timer = setInterval(() => { py.elapsed = Math.round((Date.now() - py.startedAt) / 1000); updatePyUI(); }, 1000);
  updatePyUI();

  let timeoutId;
  const timeout = new Promise((_, reject) => { timeoutId = setTimeout(() => reject(new Error('TIMEOUT')), LOAD_TIMEOUT_MS); });
  const work = (async () => {
    if (typeof window.loadPyodide !== 'function') await loadScript(PYODIDE_BASE + 'pyodide.js');
    if (typeof window.loadPyodide !== 'function') throw new Error('NO_LOADER');
    const inst = await window.loadPyodide({ indexURL: PYODIDE_BASE });
    inst.runPython(HARNESS);
    const version = inst.runPython('import sys; sys.version.split()[0]');
    return { inst, version };
  })();
  // Si le chargement aboutit après un délai dépassé, Python devient quand même disponible.
  work.then(({ inst, version }) => {
    if (py.state !== 'ready') { py.instance = inst; finishLoad({ state: 'ready', version, error: '' }); }

    await Promise.race([work, timeout]);

function createEditor({ value, minRows = 8, onInput, onRun }) {
  const gutter = h('pre', { class: 'gutter', 'aria-hidden': 'true' });
  const ta = h('textarea', {
    class: 'code', spellcheck: 'false', autocapitalize: 'off', autocomplete: 'off',
    autocorrect: 'off', wrap: 'off', 'aria-label': 'Éditeur de code Python'
  });
  ta.value = value;
  const wrap = h('div', { class: 'editor' }, gutter, ta);
  let tabEscape = false;

  function refresh() {
    const n = ta.value.split('\n').length;
    ta.rows = Math.min(Math.max(minRows, n + 1), 40);
    const nums = [];
    for (let i = 1; i <= Math.max(ta.rows, n); i++) nums.push(i);
    gutter.textContent = nums.join('\n');
    gutter.scrollTop = ta.scrollTop;
  }
  function insert(text) {
    ta.focus();
    let ok = false;
    try { ok = document.execCommand('insertText', false, text); } catch (e) { ok = false; }
    if (!ok) {
      ta.setRangeText(text, ta.selectionStart, ta.selectionEnd, 'end');
      ta.dispatchEvent(new Event('input'));
    }
  }
  ta.addEventListener('input', () => { refresh(); if (onInput) onInput(ta.value); });
  ta.addEventListener('scroll', () => { gutter.scrollTop = ta.scrollTop; });
  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { tabEscape = true; return; }
    if (e.key === 'Tab' && !e.shiftKey) {
      if (tabEscape) { tabEscape = false; return; } // Échap puis Tab : quitter l'éditeur au clavier
      e.preventDefault();
      insert('    ');
      return;
    }
    if (e.key !== 'Shift') tabEscape = false;
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      if (onRun) onRun();
      return;
    }
    if (e.key === 'Enter' && !e.shiftKey && !e.altKey && !e.isComposing) {
      const before = ta.value.slice(0, ta.selectionStart);
      const line = before.slice(before.lastIndexOf('\n') + 1);
      const indent = line.match(/^ */)[0];
      const extra = /:\s*$/.test(line) ? '    ' : '';
      if (indent || extra) { e.preventDefault(); insert('\n' + indent + extra); }
    }
  });
  refresh();
  return {
    el: wrap,
    getValue: () => ta.value,
    setValue: (v) => { ta.value = v; refresh(); },
    focus: () => ta.focus()
  };
}

function renderDashboard() {
  document.title = 'Python Coach : apprendre Python en pratiquant';
  const avail = MODULES.filter((m) => m.available);
  const cur = avail.find((m) => moduleProgress(m).done < m.steps.length);
  let ctaHref, ctaLabel;
  if (cur) {
    const nx = nextStep(cur);
    ctaHref = '#/' + cur.id + '/' + nx.id;
    ctaLabel = moduleProgress(cur).done === 0 ? 'Commencer le module ' + (MODULES.indexOf(cur) + 1) : 'Reprendre : ' + nx.title;
  } else {
    ctaHref = '#/' + avail[0].id + '/' + avail[0].steps[0].id;
    ctaLabel = 'Revoir le module 1';
  }

  const hero = h('section', { class: 'hero' },
    h('h1', null, 'Apprends Python en écrivant du vrai code.'),
    h('p', null, 'Des leçons courtes, des exercices que tu exécutes pour de vrai et des explications après chaque réussite. Ton code tourne dans ton navigateur : rien n\'est envoyé à un serveur.'),
    h('a', { class: 'btn accent', href: ctaHref }, ctaLabel)
  );

  const cards = MODULES.map((m, idx) => {
    const num = idx + 1;
    if (!m.available) {
      return h('article', { class: 'mod soon' }, h('h3', null, 'Module ' + num + ' : ' + m.title), h('span', { class: 'badge' }, 'Bientôt'));
    }
    const { done, total, pct } = moduleProgress(m);
    const lessons = m.steps.filter((x) => x.kind === 'lesson');
    const exos = m.steps.filter((x) => x.kind === 'exercise');
    const lessonsDone = lessons.filter((x) => state.done[x.id]).length;
    const exosDone = exos.filter((x) => state.done[x.id]).length;
    const finished = done === total;
    return h('article', { class: 'mod' + (m === cur ? ' main' : '') },
      h('div', { class: 'mod-head' }, h('h3', null, 'Module ' + num + ' : ' + m.title), h('span', { class: 'badge' + (finished ? ' ok' : '') }, finished ? 'Terminé' : 'Disponible')),
      h('p', { class: 'muted' }, m.summary),
      h('div', { class: 'bar', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-valuenow': String(pct), 'aria-label': 'Progression du module ' + num },
        h('i', { style: 'width:' + pct + '%' })),
      h('p', { class: 'small muted' }, pct + ' % terminé : ' + lessonsDone + ' leçon' + (lessonsDone > 1 ? 's' : '') + ' sur ' + lessons.length + ', ' + exosDone + ' exercice' + (exosDone > 1 ? 's' : '') + ' sur ' + exos.length + '.'),
      h('div', { class: 'actions' }, h('a', { class: 'btn ' + (m === cur ? 'primary' : ''), href: '#/' + m.id + '/' + (finished ? m.steps[0].id : nextStep(m).id) }, finished ? 'Revoir le module' : 'Ouvrir le module'))
    );
  });

  const resetBtn = h('button', {
    class: 'btn danger', type: 'button',
    onclick: () => {
      if (resetBtn.dataset.armed !== '1') {
        resetBtn.dataset.armed = '1';
        resetBtn.textContent = 'Confirmer : tout effacer';
        setTimeout(() => { resetBtn.dataset.armed = '0'; resetBtn.textContent = 'Réinitialiser ma progression'; }, 5000);
        return;
      }
      state = defaultState();
      saveState();
      renderDashboard();
    }
  }, 'Réinitialiser ma progression');

  app.replaceChildren(
    hero,
    !storageOk ? h('div', { class: 'alert warn' }, 'La sauvegarde locale est indisponible dans ce navigateur : ta progression ne sera pas conservée.') : null,
    h('h2', { class: 'section-title' }, 'Modules'),
    h('div', { class: 'mods' }, ...cards),
    h('div', { class: 'reset-zone' }, resetBtn)
  );
}

function buildStepperList(mod, current) {
  const ul = h('ul', { class: 'stepper' });
  let lastKind = null;
  mod.steps.forEach((s) => {
    if (s.kind !== lastKind) { ul.append(h('li', { class: 'group' }, s.kind === 'lesson' ? 'Leçons' : 'Exercices')); lastKind = s.kind; }
    const isDone = !!state.done[s.id];
    ul.append(h('li', null,
      h('a', { href: '#/' + mod.id + '/' + s.id, class: isDone ? 'done' : '', 'aria-current': s.id === current.id ? 'step' : null },
        h('span', { class: 'mark', 'aria-hidden': 'true' }, isDone ? '✓' : ''),
        h('span', null, s.title),
        isDone ? h('span', { class: 'sr' }, '(terminé)') : null)
    ));
  });
  return ul;
}

function buildNav(mod, step) {
  const i = mod.steps.indexOf(step);
  const prev = mod.steps[i - 1];
  const next = mod.steps[i + 1];
  const nav = h('div', { class: 'nav' });
  nav.append(prev ? h('a', { class: 'btn ghost', href: '#/' + mod.id + '/' + prev.id }, 'Précédent') : h('span', { class: 'spacer' }));
  if (step.kind === 'lesson') {
    const label = next && next.kind === 'exercise' ? 'Passer aux exercices' : 'Leçon suivante';
    nav.append(h('button', {
      class: 'btn primary', type: 'button',
      onclick: () => { state.done[step.id] = true; saveState(); go('/' + mod.id + '/' + next.id); }
    }, label));
  } else if (next) {
    nav.append(h('a', { class: 'btn ' + (state.done[step.id] ? 'primary' : 'ghost'), href: '#/' + mod.id + '/' + next.id }, 'Exercice suivant'));
  } else {
    nav.append(h('a', { class: 'btn ' + (state.done[step.id] ? 'primary' : 'ghost'), href: '#/' }, 'Retour au tableau de bord'));
  }
  return nav;
}

function buildLesson(mod, step) {
  const pg = createPlayground({ initial: step.example, minRows: 6, onRunRequest: () => runBtn.click() });
  const runBtn = h('button', {
    class: 'btn primary', type: 'button', 'data-run': '1', disabled: busy,
    onclick: () => guarded(() => pg.run())
  }, 'Exécuter');
  return h('article', { class: 'step' },
    h('h2', null, step.title),
    h('div', { class: 'prose', html: step.html }),
    h('div', { class: 'alert js-banner', hidden: true }),
    pg.editor.el,
    h('div', { class: 'actions' }, runBtn,
      h('button', { class: 'btn ghost', type: 'button', onclick: () => { pg.editor.setValue(step.example); pg.reset(); } }, 'Remettre l\'exemple'),
      h('span', { class: 'hint' }, 'Ctrl + Entrée pour exécuter')),
    pg.io,
    buildNav(mod, step)
  );
}

function buildExercise(mod, step, refreshStepper) {
  const exos = mod.steps.filter((s) => s.kind === 'exercise');
  const n = exos.indexOf(step) + 1;
  let t = null;
  const onInput = (v) => {
    clearTimeout(t);
    const flush = () => { state.code[step.id] = v; saveState(); if (flushPending === flush) flushPending = null; };
    flushPending = flush;
    t = setTimeout(flush, 400);
  };
  const saved = state.code[step.id];
  const pg = createPlayground({ initial: typeof saved === 'string' ? saved : step.starter, minRows: 9, onInput, onRunRequest: () => runBtn.click() });

  const checksBox = h('div', { 'aria-live': 'polite' });
  const hintBox = h('div', { class: 'hintbox', hidden: true, html: '<strong>Indice.</strong> ' + step.hint });
  const explainBox = h('div');
  const status = h('div');

  function renderChecks(list) {
    checksBox.replaceChildren(h('ul', { class: 'checks' }, ...list.map((c) =>
      h('li', { class: c.ok ? 'ok' : 'ko' },
        h('span', { class: 'ic', 'aria-hidden': 'true' }, c.ok ? '✓' : '✗'),
        h('span', null, c.label),
        h('span', { class: 'sr' }, c.ok ? ' : réussi' : ' : à corriger'))
    )));
  }
  function showExplanation(success) {
    const p = moduleProgress(mod);
    explainBox.replaceChildren(h('section', { class: 'explain' + (success ? '' : ' open') },
      h('h3', null, success ? 'Bravo, exercice réussi' : 'Solution et explications'),
      h('div', { class: 'prose', html: step.explanation }),
      h('p', { class: 'muted' }, 'Une solution possible :'),
      h('pre', { class: 'sol' }, step.solution),
      success && p.done === p.total ? h('p', null, h('strong', null, 'Tu as terminé le module ' + (MODULES.indexOf(mod) + 1) + '.'), ' ' + mod.doneText) : null
    ));
    if (success) status.replaceChildren(h('div', { class: 'alert good' }, 'Exercice réussi. Lis l\'explication ci-dessous avant de continuer.'));
  }

  const runBtn = h('button', { class: 'btn primary', type: 'button', 'data-run': '1', disabled: busy, onclick: () => guarded(() => pg.run()) }, 'Exécuter');
  const verifyBtn = h('button', {
    class: 'btn accent', type: 'button', 'data-run': '1', disabled: busy,
    onclick: () => guarded(async () => {
      const code = pg.editor.getValue();
      const res = await pg.run();
      if (res.notReady || res.internal) { checksBox.replaceChildren(); return; }
      const list = [{ label: 'Le programme s\'exécute sans erreur', ok: !res.error }]
        .concat(step.checks.map((c) => ({ label: c.label, ok: !!safe(() => c.test(res, code)) })));
      if (step.cases && !res.error) {
        for (const c of step.cases) {
          const v = makeVariant(code, c.set);
          if (v.missing.length) {
            list.push({ label: 'Garde la ligne « ' + v.missing[0] + ' = … » au début du code, sans retrait : l\'application s\'en sert pour tester ton programme avec d\'autres valeurs', ok: false });
            break;
          }
          const r = await runPython(v.code, 3);
          let ok = false;
          let got = '';
          if (r.internal || r.notReady) { got = 'exécution impossible'; }
          else if (r.error) { got = 'erreur ' + r.error.type + (r.error.type === 'Timeout' ? ' : le programme ne s\'arrête pas' : ''); }
          else if (c.lines) {
            const diff = compareLines(r.stdout, c.lines);
            ok = diff === null;
            got = diff || '';
          } else { got = lastLine(r.stdout); ok = got === c.out; got = got ? '« ' + got + ' »' : 'rien'; }
          const expected = c.desc || ('affiche « ' + c.out + ' »');
          list.push({ label: 'Avec ' + describeSet(c.set) + ' : ' + expected + (ok ? '' : ' (obtenu : ' + got + ')'), ok });
        }
      }
      if (step.calls && !res.error) {
        const rr = await runEval(code, step.calls.map((c) => (c.setup ? '!' + c.setup : c.call)), 3);
        if (rr.internal || rr.notReady) {
          list.push({ label: 'Tes fonctions n\'ont pas pu être testées (Python indisponible ou erreur interne)', ok: false });
        } else if (rr.error) {
          list.push({ label: 'Les appels de test ont échoué : ' + rr.error.type + (rr.error.line ? ' à la ligne ' + rr.error.line : '') + ' : ' + rr.error.message, ok: false });
        } else {
          let stop = false;
          step.calls.forEach((c, i) => {
            if (stop) return;
            const r = rr.results[i];
            if (c.setup) {
              if (r && r.ok) list.push({ label: 'Préparation : ' + c.setup, ok: true });
              else { list.push({ label: 'Préparation « ' + c.setup + ' » : ' + describeGot(r), ok: false }); stop = true; }
              return;
            }
            const ok = matchesExpected(r, c.expect);
            if (c.label) {
              const plain = r && r.ok && (r.repr === 'True' || r.repr === 'False');
              list.push({ label: c.label + (ok || plain ? '' : ' (obtenu : ' + describeGot(r) + ')'), ok });
            } else {
              list.push({ label: 'Appel ' + c.call + ' : doit renvoyer ' + expectedText(c.expect) + (ok ? '' : ' (obtenu : ' + describeGot(r) + ')'), ok });
            }
          });
        }
      }
      renderChecks(list);
      state.code[step.id] = code;
      if (list.every((c) => c.ok)) {
        state.done[step.id] = true;
        saveState();
        showExplanation(true);
        refreshStepper();
      } else {
        saveState();
        solutionBtn.hidden = false;
      }
    })
  }, 'Vérifier ma réponse');
  const hintBtn = h('button', {
    class: 'btn ghost', type: 'button', 'aria-expanded': 'false',
    onclick: () => { hintBox.hidden = !hintBox.hidden; hintBtn.setAttribute('aria-expanded', String(!hintBox.hidden)); }
  }, 'Indice');
  const solutionBtn = h('button', {
    class: 'btn ghost', type: 'button', hidden: !state.done[step.id] ? true : false,
    onclick: () => showExplanation(!!state.done[step.id])
  }, 'Voir une solution');
  const resetBtn = h('button', {
    class: 'btn ghost', type: 'button',
    onclick: () => { pg.editor.setValue(step.starter); state.code[step.id] = step.starter; saveState(); pg.reset(); checksBox.replaceChildren(); }
  }, 'Recommencer');

  if (state.done[step.id]) { showExplanation(true); }

  return h('article', { class: 'step' },
    h('p', { class: 'muted small' }, 'Exercice ' + n + ' sur ' + exos.length),
    h('h2', null, step.title),
    h('div', { class: 'brief', html: step.brief }),
    h('div', { class: 'alert js-banner', hidden: true }),
    pg.editor.el,
    h('div', { class: 'actions' }, runBtn, verifyBtn, hintBtn, solutionBtn, resetBtn),
    h('p', { class: 'hint small muted' }, 'Ctrl + Entrée pour exécuter. Dans l\'éditeur, Tab ajoute une indentation ; Échap puis Tab quitte l\'éditeur.'),
    hintBox,
    pg.io,
    checksBox,
    status,
    explainBox,
    buildNav(mod, step)
  );
}

function renderStep(mod, step) {
  document.title = step.title + ' : Python Coach';
  const holder = h('nav', { 'aria-label': 'Étapes du module' });
  const refreshStepper = () => holder.replaceChildren(buildStepperList(mod, step));
  refreshStepper();
  const content = step.kind === 'lesson' ? buildLesson(mod, step) : buildExercise(mod, step, refreshStepper);
  app.replaceChildren(
    h('a', { class: 'crumb', href: '#/' }, 'Retour aux modules'),
    h('div', { class: 'layout' }, holder, content)
  );
  try { window.scrollTo(0, 0); } catch (e) { /* sans importance */ }
  if (py.state === 'idle') loadPython(); else updatePyUI();
}

/* =====================================================================
   9. ROUTAGE (hash : #/ ou #/m1/ex2)
   ===================================================================== */
// La navigation ne dépend pas du hash : dans certains contextes (aperçu intégré,
// cadre isolé), changer location.hash ne fonctionne pas. Le hash n'est qu'un bonus
// (bouton Précédent, lien partageable) quand le navigateur l'autorise.
let currentPath = '/';
try { currentPath = location.hash.replace(/^#/, '') || '/'; } catch (e) { currentPath = '/'; }
let ignoreHashChange = false;
function go(path) {
  currentPath = path;
  try {
    if (location.hash !== '#' + path) { ignoreHashChange = true; location.hash = '#' + path; }
  } catch (e) { ignoreHashChange = false; }
  route();
}
function route() {
  if (flushPending) flushPending();
  const parts = currentPath.replace(/^\/?/, '').split('/').filter(Boolean);
  if (!parts.length) { renderDashboard(); updatePyUI(); return; }
  const mod = MODULES.find((m) => m.id === parts[0] && m.available);
  if (!mod) { go('/'); return; }
  const step = mod.steps.find((s) => s.id === parts[1]) || nextStep(mod);
  renderStep(mod, step);
}
window.addEventListener('hashchange', () => {
  if (ignoreHashChange) { ignoreHashChange = false; return; }
  try { currentPath = location.hash.replace(/^#/, '') || '/'; } catch (e) { return; }
  route();
});
document.addEventListener('click', (e) => {
  const a = e.target.closest && e.target.closest('a[href^="#/"]');
  if (!a || e.ctrlKey || e.metaKey || e.shiftKey || e.button) return;
  e.preventDefault();
  go(a.getAttribute('href').slice(1));
});
route();
updatePyUI();
})();
</script>
