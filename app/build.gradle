plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pythoncoach.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pythoncoach.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    // Aligne les versions de Kotlin utilisées en interne par AndroidX.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
