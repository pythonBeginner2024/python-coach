name: Construire l'APK Python Coach

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier que Pyodide est présent
        run: |
          for f in pyodide.js pyodide.asm.js pyodide.asm.wasm pyodide-lock.json python_stdlib.zip; do
            if [ ! -s "app/src/main/assets/pyodide/$f" ]; then
              echo "ERREUR : app/src/main/assets/pyodide/$f est absent ou vide."
              exit 1
            fi
          done
          ls -la app/src/main/assets/pyodide

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer le SDK Android déjà installé sur la machine GitHub
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "sdkmanager : $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" || true
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Construire l'APK (debug)
        run: gradle assembleDebug --stacktrace

      - name: Signer l'APK avec votre clé officielle
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        # Correction ajoutée ici pour forcer l'usage des outils modernes installés (35.0.0)
        env:
          BUILD_TOOLS_VERSION: "35.0.0"
        with:
          releaseDirectory: app/build/outputs/apk/debug
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: python-coach-apk
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          if-no-files-found: error
