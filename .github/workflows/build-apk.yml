name: Construire l'APK Python Coach

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier que Pyodide est présent
        run: |
          for f in pyodide.js pyodide.asm.js pyodide.asm.wasm pyodide-lock.json python_stdlib.zip; do
            if [ ! -s "app/src/main/assets/pyodide/$f" ]; then
              echo "ERREUR : app/src/main/assets/pyodide/$f est absent ou vide."
              exit 1
            fi
          done
          ls -la app/src/main/assets/pyodide

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Construire l'APK (debug)
        run: gradle assembleDebug --stacktrace

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: python-coach-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
